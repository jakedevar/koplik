<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Koplik WASM synthetic benchmark</title>
<h1>Koplik WASM synthetic benchmark</h1>
<p>Artificial seven-county inputs; no claims about observed Gaines County cases.</p>
<button id="run" disabled>Run 1,000-member ensemble benchmark</button>
<pre id="result">Loading WASM…</pre>
<script type="module">
  import init, { runEnsemble } from '../../pkg/web/koplik_wasm.js';
  import { benchmark } from './benchmark-core.mjs';
  const result = document.querySelector('#result');
  const button = document.querySelector('#run');
  try {
    await init();
    const scenarioJson = await (await fetch('../../data/fixtures/seir/synthetic-scenario.json')).text();
    result.textContent = 'Ready. Run in a foreground tab, then copy these measurements.';
    button.disabled = false;
    button.onclick = () => {
      button.disabled = true;
      try {
        const output = { measured_at: new Date().toISOString(), user_agent: navigator.userAgent, ...benchmark(runEnsemble, scenarioJson) };
        result.textContent = JSON.stringify(output, null, 2);
        window.benchmarkResult = output;
      } catch (error) {
        result.textContent = String(error);
      } finally { button.disabled = false; }
    };
  } catch (error) { result.textContent = String(error); }
</script>
</html>
