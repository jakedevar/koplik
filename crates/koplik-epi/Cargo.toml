[package]
name = "koplik-epi"
version = "0.1.0"
description = "Koplik epidemic engine and inference: SEIR, R_t, nowcast, backtest scoring. Pure: no I/O."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
koplik-contracts = { path = "../koplik-contracts" }
libm.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]

[features]
# Research-only #1677 R_t gate simulator (`rt_gate_sim`). Off by default: production, pipeline
# and wasm builds do not compile it and it is not part of the public engine API.
research-sim = []

[[example]]
name = "rt_gate_sim"
required-features = ["research-sim"]

[[bench]]
name = "seir_ensemble"
harness = false
